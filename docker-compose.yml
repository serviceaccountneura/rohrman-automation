services:
  db:
    image: postgres:17-alpine
    container_name: rohrman_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rohrman
      POSTGRES_PASSWORD: rohrman
      POSTGRES_DB: rohrman
    ports:
      - "5432:5432"
    volumes:
      - rohrman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rohrman -d rohrman"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rohrman_pgdata:
