<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tekion Data Entry</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    body { max-width: 820px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    select, textarea, button { font-size: 14px; width: 100%; box-sizing: border-box; }
    select { padding: 8px; }
    textarea { min-height: 260px; padding: 10px; font-family: ui-monospace, Menlo, monospace; }
    button { margin-top: 16px; padding: 12px; background: #111; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
    .meta { color: #666; font-size: 12px; }
    .ok { color: #0a7d27; } .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Tekion Data Entry → Internal API</h1>
  <p class="meta">Pick a captured endpoint, edit the JSON payload with your data, and submit. The request replays through your saved Tekion session.</p>

  <label for="ep">Endpoint</label>
  <select id="ep"></select>
  <div class="meta" id="epmeta"></div>

  <label for="body">Payload (JSON)</label>
  <textarea id="body" spellcheck="false"></textarea>

  <label for="tokenKey">Bearer token localStorage key (optional)</label>
  <select id="tokenKey"><option value="">— none / cookie auth —</option></select>

  <button id="go">Insert into Tekion</button>

  <h3>Result</h3>
  <pre id="out">—</pre>

  <script>
    let endpoints = [];

    async function load() {
      endpoints = await fetch('/api/endpoints').then(r => r.json());
      const sel = document.getElementById('ep');
      if (!endpoints.length) {
        sel.innerHTML = '<option>(no captured endpoints — run capture + analyze)</option>';
        document.getElementById('go').disabled = true;
        return;
      }
      sel.innerHTML = endpoints.map((e, i) =>
        `<option value="${i}">${e.method} ${e.url.replace(/^https?:\/\/[^/]+/, '')}</option>`).join('');
      sel.onchange = render;
      render();

      // Populate token-key dropdown from captured-localstorage-tokens.json if present.
      try {
        const toks = await fetch('/captured-localstorage-tokens.json').then(r => r.ok ? r.json() : {});
        const tk = document.getElementById('tokenKey');
        Object.keys(toks).forEach(k => {
          const o = document.createElement('option'); o.value = k; o.textContent = k; tk.appendChild(o);
        });
      } catch {}
    }

    function render() {
      const e = endpoints[document.getElementById('ep').value];
      document.getElementById('epmeta').textContent =
        `${e.method} ${e.url}` + (e.relevantHeaders?.length ? `  ·  headers: ${e.relevantHeaders.join(', ')}` : '');
      document.getElementById('body').value = JSON.stringify(e.exampleBody ?? {}, null, 2);
    }

    document.getElementById('go').onclick = async () => {
      const e = endpoints[document.getElementById('ep').value];
      const out = document.getElementById('out');
      let body;
      try { body = JSON.parse(document.getElementById('body').value); }
      catch (err) { out.className = 'err'; out.textContent = 'Invalid JSON: ' + err; return; }

      out.className = ''; out.textContent = 'Submitting…';
      const r = await fetch('/api/insert', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          url: e.url, method: e.method, body,
          tokenLocalStorageKey: document.getElementById('tokenKey').value || undefined,
        }),
      }).then(r => r.json());

      out.className = r.ok ? 'ok' : 'err';
      out.textContent = JSON.stringify(r, null, 2);
    };

    load();
  </script>
</body>
</html>
